<style>
/* FitForge — styles. Dark by default, light when the system asks for it. */

:root {
  --bg: #0e1116;
  --bg-2: #151a22;
  --surface: #1a2029;
  --surface-2: #212936;
  --line: #2a3341;
  --fg: #e8ecf4;
  --muted: #8b97ab;
  --accent: #4ade80;
  --accent-ink: #06240f;
  --danger: #f87171;
  --radius: 14px;
  --shadow: 0 12px 32px rgba(0, 0, 0, .35);
}

/* Light palette. Applied when the system asks for it, unless a host has
 * explicitly stamped data-theme="dark" on the root element. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6fa;
    --bg-2: #ffffff;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --line: #dde3ec;
    --fg: #131922;
    --muted: #5d6b80;
    --accent: #16a34a;
    --accent-ink: #ffffff;
    --danger: #dc2626;
    --shadow: 0 10px 26px rgba(20, 30, 50, .10);
  }
}

/* An explicit light choice always wins, whatever the system says. Comes after
 * the media query so it takes precedence at equal specificity. */
:root[data-theme="light"] {
  --bg: #f4f6fa;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --line: #dde3ec;
  --fg: #131922;
  --muted: #5d6b80;
  --accent: #16a34a;
  --accent-ink: #ffffff;
  --danger: #dc2626;
  --shadow: 0 10px 26px rgba(20, 30, 50, .10);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

.app { max-width: 1080px; margin: 0 auto; padding: 0 16px 96px; }

<script>
/* ===== assets/js/anim.js ===== */
/*
 * anim.js — procedural exercise animation engine.
 *
 * Renders a 2D skeletal stick figure to a <canvas> and drives it through a
 * keyframed motion so any exercise can have a generated demonstration without
 * needing a video file or a network connection.
 *
 * Model: every segment is stored as an ABSOLUTE angle in degrees measured in
 * the figure's local frame.
 *   - torso: 0 = straight up, positive = leaning forward (towards +x / screen right)
 *   - limbs: 0 = straight down, positive = swinging forward (towards +x)
 * The whole figure can then be rotated about the hip with `rot` (clockwise
 * degrees), which is how lying/horizontal moves such as push-ups and planks are
 * authored: they are written as an upright figure and tipped over 90 degrees.
 */
(function (global) {
  'use strict';

  var RAD = Math.PI / 180;

  // Segment lengths, in figure units. Total standing height is roughly 100.
  var L = {
    torso: 34,
    neck: 9,
    headR: 7,
    upperArm: 18,
    foreArm: 17,
    thigh: 24,
    shin: 24,
    foot: 9
  };

  // Every pose is a sparse override of this neutral standing pose.

  function dirUp(a) { return [Math.sin(a * RAD), -Math.cos(a * RAD)]; }
  function dirDown(a) { return [Math.sin(a * RAD), Math.cos(a * RAD)]; }

   * with the hip at the origin, already rotated by pose.rot. */

    var headBase = add(neck, dirUp(pose.torso + pose.head), L.neck);
    // The shoulders sit a touch below the neck joint.
    var shoulder = add(hip, dirUp(pose.torso), L.torso * 0.94);

    function arm(a, f) {
      var elbow = add(shoulder, dirDown(a), L.upperArm);
      return { elbow: elbow, hand: add(elbow, dirDown(f), L.foreArm) };
    }
    function leg(t, s, ft) {

      var ankle = add(knee, dirDown(s), L.shin);
      return { knee: knee, ankle: ankle, toe: add(ankle, dirDown(ft), L.foot) };

      neck: neck,
      shoulder: shoulder,
      head: headBase,
      armN: arm(pose.armN, pose.foreN),
      armF: arm(pose.armF, pose.foreF),
      legN: leg(pose.thighN, pose.shinN, pose.footN),

      pts.shoulder = rotate(pts.shoulder);
      pts.head = rotate(pts.head);
      ['armN', 'armF'].forEach(function (k) {

      });
      ['legN', 'legF'].forEach(function (k) {
        pts[k] = { knee: rotate(pts[k].knee), ankle: rotate(pts[k].ankle), toe: rotate(pts[k].toe) };
      });
    }
    return pts;

/* ===== assets/js/exercises.js ===== */
/*
 * exercises.js — the exercise library and the exercise editor.
 * The editor is where the "how do I do this?" demo gets attached, via the

 * animation locally.

(function (global) {
  'use strict';

  var el = UI.el;

    var set = {};

    return ['All'].concat(Object.keys(set).sort());
  }

  function matches(ex) {
    if (filter.category !== 'All' && ex.category !== filter.category) return false;
    if (!filter.text) return true;
    var hay = (ex.name + ' ' + ex.muscles + ' ' + ex.equipment + ' ' + ex.notes).toLowerCase();
    return hay.indexOf(filter.text.toLowerCase()) !== -1;

  function render(root) {
    UI.clear(root);

    var list = el('div.grid');

    var search = el('input.input', {
      type: 'search', placeholder: 'Search exercises…', value: filter.text,
      oninput: function (e) { filter.text = e.target.value; paint(); }
    });

    var cats = el('div.chips');
    function paintChips() {
      UI.clear(cats);
      categories().forEach(function (c) {
        cats.appendChild(el('button.chip' + (filter.category === c ? '.chip-on' : ''), {
          type: 'button', text: c,
          onclick: function () { filter.category = c; paint(); }

    root.appendChild(el('div.page-head', [

        el('h1', { text: 'Exercises' }),
        el('p.sub', { text: 'Your library. Every exercise can carry a video, GIF or generated animation.' })

        type: 'button', onclick: function () { edit(null); }
      }, [UI.icon('plus'), 'New exercise'])
    ]));
    root.appendChild(el('div.toolbar', [search, cats]));
    root.appendChild(list);

    function paint() {
      paintChips();
      UI.clear(list);
      var items = Store.exercises().filter(matches);
      if (!items.length) {
        list.appendChild(UI.empty(
          'Nothing here yet',
          Store.exercises().length ? 'No exercise matches that filter.' : 'Add your first exercise to get started.',
          el('button.btn.btn-primary', { type: 'button', text: 'New exercise', onclick: function () { edit(null); } })
        ));
        return;
      }
      items.forEach(function (ex) { list.appendChild(card(ex)); });

  function card(ex) {

  /* ---------------------------------------------------------- demo picker */

  /* The headline feature: four ways to answer "how do I do this exercise?" */
  function demoPicker(ex, onchange) {
    var media = ex.media;
    var tabsWrap = el('div.tabs');
    var panel = el('div.tab-panel');
    var previewWrap = el('div.demo-preview');

    var TABS = [
      { key: 'animation', label: 'Generate animation' },
      { key: 'search', label: 'Search the web' },
      { key: 'link', label: 'Paste a link' },
      { key: 'upload', label: 'Upload a file' }
    ];
    // "search" is a way of getting to a link, so an exercise saved with a URL
    // reopens on the link tab.
    var active = media.type === 'upload' ? 'upload' : (media.type === 'link' ? 'link' : 'animation');

    function setActive(key) {

      paintPanel();
    }

    function paintTabs() {
      UI.clear(tabsWrap);
      TABS.forEach(function (t) {

    function refreshPreview() {
      Media.stop(previewWrap);

      previewWrap.appendChild(el('p.demo-caption', { text: Media.describe(ex) }));
    }

    function paintPanel() {
      UI.clear(panel);
      if (active === 'animation') panel.appendChild(animationPanel());

      }

      var presetSelect = UI.select(presetOptions, media.preset || 'auto', function (e) {

          if (previewWrap.querySelector('.media') && previewWrap.querySelector('.media')._player) {

          }
        }

      function updateCue() {
        cue.textContent = Media.motionFor(ex).cue;
      }

      var custom = el('div.custom-block');
      var status = el('p.gen-status');
      var busy = false;

      var describe = el('textarea.input', {
        rows: 2,
        placeholder: 'Optional: describe the movement in your own words, if it is unusual or you know it by a different name.',
        oninput: function (e) { media.customNote = e.target.value; }

    function linkPanel() {

        type: 'url', placeholder: 'https://…',

        image: 'Recognised as an image or GIF — it will loop.',

      routines.slice(0, 3).forEach(function (r) {
        list.appendChild(el('article.routine-card', [
          el('div.routine-main', [
            el('h3', { text: r.name }),
            el('p.routine-meta', {
              text: r.items.length + ' exercises · about ' + UI.fmtDuration(Store.estimateSeconds(r))
            })
          ]),
          el('div.routine-actions', [
            el('button.btn.btn-primary', {
              type: 'button', disabled: !r.items.length, onclick: function () { Player.start(r); }
            }, [UI.icon('play'), 'Start'])
          ])
        ]));
      });
      if (routines.length > 3) {
        list.appendChild(el('button.btn.btn-ghost', { type: 'button', text: 'See all routines', onclick: function () { go('routines'); } }));
      }
    }
    node.appendChild(list);

    if (hist.length) {
      node.appendChild(el('h2.section-title', { text: 'Recent' }));
      var recent = el('div.history-list');
      hist.slice(0, 3).forEach(function (h) { recent.appendChild(historyRow(h)); });
      node.appendChild(recent);
    }
  }

  function greeting() {
    var h = new Date().getHours();
    if (h < 12) return 'Good morning — ready to train?';
    if (h < 18) return 'Good afternoon — ready to train?';
    return 'Good evening — ready to train?';
  }

  function stat(value, label) {
    return el('div.stat', [el('strong', { text: value }), el('span', { text: label })]);
  }

  /* The hero shows off the generated-animation feature, cycling through the
   * motions the app knows how to draw. */
  function heroAnimation() {
    var canvas = el('canvas.anim-canvas');
    var caption = el('p.hero-caption');
    var wrap = el('div.hero-anim', [canvas, caption]);
    var keys = Anim.list().filter(function (m) { return m.key !== 'generic'; });
    var i = Math.floor(Math.random() * keys.length);

    requestAnimationFrame(function () {
      var player = new Anim.Player(canvas, { motion: keys[i].key, tempo: 2.2 });
      wrap._player = player;
      caption.textContent = keys[i].label;
      player.start();
      var timer = setInterval(function () {
        if (!document.body.contains(canvas)) { clearInterval(timer); player.stop(); return; }
        i = (i + 1) % keys.length;
        player.setMotion(keys[i].key);
        caption.textContent = keys[i].label;
      }, 6000);
    });
    return wrap;
  }

  /* --------------------------------------------------------------- history */

  function history(node) {
    UI.clear(node);
    var hist = Store.history();

    node.appendChild(el('div.page-head', [
      el('div', [
        el('h1', { text: 'History' }),
        el('p.sub', { text: 'Every workout you have finished or partly finished.' })
      ]),
      hist.length ? el('button.btn.btn-ghost', {
        type: 'button', text: 'Clear history',
        onclick: function () {
          UI.confirmDialog('Delete your whole workout history?', function () {
            Store.clearHistory(); refresh(); UI.toast('History cleared');
          });
        }
      }) : null
    ]));

    if (!hist.length) {
      node.appendChild(UI.empty('No workouts logged yet', 'Finish a routine and it will show up here.'));
    } else {
      var total = hist.reduce(function (a, h) { return a + h.seconds; }, 0);
      node.appendChild(el('div.stats', [
        stat(String(hist.length), 'workouts'),
        stat(UI.fmtDuration(total), 'total time'),
        stat(UI.fmtDuration(total / hist.length), 'average')
      ]));
      var list = el('div.history-list');
      hist.forEach(function (h) { list.appendChild(historyRow(h)); });
      node.appendChild(list);
    }

    node.appendChild(el('h2.section-title', { text: 'Custom animations' }));
    node.appendChild(apiKeyPanel());

    node.appendChild(el('h2.section-title', { text: 'Your data' }));
    node.appendChild(el('div.settings', [
      el('p.panel-note', { text: 'Everything is stored in this browser only. Export a copy to move it to another device or keep a backup.' }),
      el('div.row', [
        el('button.btn.btn-ghost', { type: 'button', text: 'Export JSON', onclick: exportData }),
        el('label.btn.btn-ghost', [
          'Import JSON',
          el('input', {
            type: 'file', accept: 'application/json,.json', hidden: 'hidden', onchange: importData
          })
        ]),
        el('button.btn.btn-danger', {
          type: 'button', text: 'Reset everything',
          onclick: function () {
            UI.confirmDialog('This deletes all your exercises, routines and history, and restores the starter set.', function () {
              Store.resetAll(); refresh(); UI.toast('Reset to the starter library');
            });
          }
        })
      ])
    ]));
  }

  /* Where the user connects a Claude API key, which is what unlocks animations
   * generated for a specific exercise rather than matched from its name. */
  function apiKeyPanel() {
    var panel = el('div.settings');
    var status = el('p.gen-status');
    var input = el('input.input', {
      type: 'password',
      placeholder: 'sk-ant-…',
      value: Coach.getKey(),
      autocomplete: 'off',
      spellcheck: 'false'
    });

    function save() {
      var value = input.value.trim();
      if (!Coach.setKey(value)) { status.textContent = 'Could not save the key to browser storage.'; return; }
      if (!value) {
        status.textContent = 'Key removed. Exercises will use stock motions.';
        status.className = 'gen-status';
        refresh();
        return;
      }
      status.textContent = 'Checking the key…';
      status.className = 'gen-status gen-working';
      Coach.testKey(value).then(function () {
        status.textContent = 'Key works. Custom animations are enabled.';
        status.className = 'gen-status gen-ok';
      }, function (err) {
        status.textContent = err.message;
        status.className = 'gen-status gen-error';
      });
    }

    panel.appendChild(el('p.panel-note', {
      text: 'Without a key, an exercise gets the stock motion whose name is closest — fine for a squat, wrong for anything unusual. With one, the app asks Claude how your exercise is actually performed, searching the web when it is not sure, and builds an animation for that movement.'
    }));
    panel.appendChild(UI.field('Claude API key', input,
      'Stored in this browser only, and never included in a data export.'));
    panel.appendChild(el('div.row', [
      el('button.btn.btn-primary', { type: 'button', text: 'Save key', onclick: save }),
      el('a.btn.btn-ghost', {
        href: 'https://console.anthropic.com/settings/keys', target: '_blank', rel: 'noopener noreferrer',
        text: 'Get a key'
      })
    ]));
    panel.appendChild(status);
    panel.appendChild(el('p.panel-note.panel-warn', {
      text: 'Worth knowing: a key held in a browser is only as private as the device it is on, and anyone who can open this page can spend against it. Use a key created for this app alone, set a spend limit on it, and revoke it if the device is shared. Each animation is one request, costing a few cents at most.'
    }));
    return panel;
  }

  function historyRow(h) {
    return el('div.history-row', [
      el('div', [
        el('strong', { text: h.routineName }),
        el('span.sub', { text: UI.fmtDate(h.finishedAt) })
      ]),
      el('div.history-right', [
        el('span.pill', { text: UI.fmtDuration(h.seconds) }),
        el('span.sub', { text: h.completed + '/' + h.total + ' sets' })
      ])
    ]);
  }

  function exportData() {
    var blob = new Blob([Store.exportJSON()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: 'fitforge-backup-' + new Date().toISOString().slice(0, 10) + '.json' });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    UI.toast('Backup downloaded');
  }

  function importData(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        Store.importJSON(reader.result);
        refresh();
        UI.toast('Data imported');
      } catch (err) {
        UI.toast(err.message || 'That file could not be imported');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  /* ------------------------------------------------------------------ boot */

  function init() {
    root = document.getElementById('view');
    Store.load();

    var hash = (global.location.hash || '').replace('#', '');
    if (VIEWS.some(function (v) { return v.key === hash; })) current = hash;

    global.addEventListener('hashchange', function () {
      var h = (global.location.hash || '').replace('#', '') || 'home';
      if (h !== current && VIEWS.some(function (v) { return v.key === h; })) {
        current = h;
        paintNav();
        render();
      }
    });

    // Canvas sizing depends on layout, so redraw on resize.
    var resizeTimer;
    global.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 200);
    });

    // Keep the exercise datalist in sync for the category input.
    Store.subscribe(paintCategoryList);
    paintCategoryList();

    paintNav();
    render();
  }

  function paintCategoryList() {
    var dl = document.getElementById('category-list');
    if (!dl) return;
    UI.clear(dl);
    var seen = {};
    ['Strength', 'Cardio', 'Core', 'Mobility'].concat(
      Store.exercises().map(function (e) { return e.category; })
    ).forEach(function (c) {
      if (!c || seen[c]) return;
      seen[c] = true;
      dl.appendChild(el('option', { value: c }));
    });
  }

  /* Key setup as a modal, so the exercise editor can send you here and back
   * without losing the exercise you were halfway through writing. */
  function openSettings(onClose) {
    var m = UI.modal('Custom animations', apiKeyPanel(), el('div.row-end', [
      el('button.btn.btn-primary', { type: 'button', text: 'Done', onclick: function () { m.close(); } })
    ]), onClose);
  }

  global.App = { init: init, go: go, refresh: refresh, openSettings: openSettings };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})(window);

</script>
